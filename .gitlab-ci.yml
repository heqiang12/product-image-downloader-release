# 商品图片下载助手 — GitLab CI
# 触发方式：推送 tag（v1.2.3）时自动打包并发布到 GitLab Release
# 环境要求：注册一个 Windows 类型 runner（shell executor，预装 Node.js 22+）
# 需要的 CI 变量：
#   GITLAB_TOKEN  — Personal Access Token（需 api 权限，用于上传 Release 资产）

stages:
  - release

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

build-and-release:
  stage: release
  tags:
    - windows
  only:
    - /^v\d+\.\d+\.\d+$/
  script:
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm run dist:win
    - powershell -ExecutionPolicy Bypass -File scripts/gitlab-release.ps1
  artifacts:
    paths:
      - release/
    expire_in: 1 week
